<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZX81 Art Studio</title>
    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --accent: #00ff00;
            --text: #e0e0e0;
        }

        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; display: flex; height: 100vh; overflow: hidden;
        }

        /* Side Panel for Canvas */
        .left-panel {
            width: 400px; background: var(--panel);
            border-right: 2px solid #000;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; box-sizing: border-box;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }

        /* Code Area */
        .right-panel {
            flex-grow: 1; display: flex; flex-direction: column;
            padding: 20px; box-sizing: border-box; background: var(--bg);
        }

        #stage { 
            width: 256px; height: 192px; background: #fff; 
            border: 8px solid #444; image-rendering: pixelated;
            margin-bottom: 20px; position: relative;
        }

        canvas { width: 100%; height: 100%; cursor: crosshair; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }

        button { 
            padding: 12px; background: #333; color: white; 
            border: 1px solid #555; cursor: pointer; font-weight: bold;
            transition: 0.2s;
        }

        button:hover { background: var(--accent); color: #000; }
        
        .upload-btn { 
            background: #0055aa; grid-column: span 2; 
            text-align: center; line-height: 40px; cursor: pointer;
        }

        textarea { 
            flex-grow: 1; background: #000; color: var(--accent); 
            border: 1px solid #333; font-family: 'Courier New', monospace;
            padding: 15px; resize: none; font-size: 13px;
            outline: none;
        }

        .label { margin-bottom: 10px; font-size: 12px; color: #888; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="left-panel">
        <h2 style="color: var(--accent); margin-top: 0;">ZX81 STUDIO</h2>
        
        <div class="label">Preview (64x48 PLOT)</div>
        <div id="stage">
            <canvas id="canvas" width="64" height="48"></canvas>
        </div>

        <div class="btn-group">
            <label class="upload-btn">
                📂 LOAD IMAGE
                <input type="file" id="loader" accept="image/*" style="display:none" onchange="handleImage(this)">
            </label>
            <button onclick="generateBasic()">🔄 GEN BASIC</button>
            <button onclick="copyCode()">📋 COPY CODE</button>
            <button onclick="clearCanvas()" style="grid-column: span 2;">🗑️ RESET ALL</button>
        </div>
        
        <p style="font-size: 11px; color: #666; margin-top: 20px; text-align: center;">
            Note: Resulting code requires 16K RAM setting in your ZX81 emulator.
        </p>
    </div>

    <div class="right-panel">
        <div class="label">Generated ZX81 BASIC Code</div>
        <textarea id="basicCode" spellcheck="false" placeholder="BASIC code listing will appear here..."></textarea>
    </div>

    <script>
        const cvs = document.getElementById('canvas');
        const ctx = cvs.getContext('2d');
        const codeArea = document.getElementById('basicCode');

        function handleImage(input) {
            if (!input.files[0]) return;
            const reader = new FileReader();
            reader.onload = function(event){
                const img = new Image();
                img.onload = function(){
                    ctx.fillStyle = "white";
                    ctx.fillRect(0, 0, 64, 48);
                    
                    // Center and Scale image
                    let scale = Math.min(64 / img.width, 48 / img.height);
                    let x = (64 / 2) - (img.width / 2) * scale;
                    let y = (48 / 2) - (img.height / 2) * scale;
                    ctx.drawImage(img, x, y, img.width * scale, img.height * scale);

                    // Threshold (B&W)
                    const imageData = ctx.getImageData(0, 0, 64, 48);
                    const data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                        const val = avg < 127 ? 0 : 255;
                        data[i] = data[i+1] = data[i+2] = val;
                    }
                    ctx.putImageData(imageData, 0, 0);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }

        function generateBasic() {
            let line = 10;
            let output = "10 FAST\n20 CLS\n";
            line = 30;

            const data = ctx.getImageData(0, 0, 64, 48).data;

            for (let y = 0; y < 48; y++) {
                for (let x = 0; x < 64; x++) {
                    const idx = (y * 64 + x) * 4;
                    if (data[idx] === 0) { 
                        const zxY = 47 - y; 
                        output += `${line} PLOT ${x},${zxY}\n`;
                        line += 2;
                        // Safety for very long listings
                        if (line > 9000) line = 9001; 
                    }
                }
            }
            
            output += "9998 SLOW\n";
            output += "9999 PAUSE 0";
            codeArea.value = output;
        }

        function copyCode() {
            codeArea.select();
            document.execCommand('copy');
            alert("Code copied to clipboard!");
        }

        function clearCanvas() {
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, 64, 48);
            codeArea.value = "";
        }
    </script>
</body>
</html>
