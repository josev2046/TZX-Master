<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZX81 Pro Studio (1K + 16K)</title>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --accent: #00ff00; --text: #e0e0e0; }
        body { background: var(--bg); color: var(--text); font-family: monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 380px; background: var(--panel); border-right: 2px solid #000; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; background: var(--bg); }
        #stage { width: 256px; height: 192px; background: #fff; border: 4px solid #444; image-rendering: pixelated; margin: 0 auto 20px auto; position: relative; }
        canvas { width: 100%; height: 100%; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
        button { padding: 10px; background: #333; color: #fff; border: 1px solid #555; cursor: pointer; font-weight: bold; font-size: 10px; }
        button:hover { background: var(--accent); color: #000; }
        .full-width { grid-column: span 2; }
        .upload-btn { background: #0055aa; line-height: 35px; text-align: center; cursor: pointer; font-size: 11px; font-weight: bold; }
        textarea { flex-grow: 1; background: #000; color: var(--accent); border: 1px solid #333; padding: 15px; font-family: 'Courier New', monospace; font-size: 12px; outline: none; }
        .header-label { font-size: 10px; color: #888; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 style="color: var(--accent); margin: 0 0 20px 0; text-align: center;">ZX81 PRO STUDIO</h2>
        
        <div id="stage"><canvas id="canvas" width="64" height="48"></canvas></div>

        <div class="btn-grid">
            <label class="upload-btn full-width">📂 CONVERT PHOTO<input type="file" id="loader" accept="image/*" style="display:none" onchange="handleImage(this)"></label>
            <button onclick="generateBasic()">⚡ GEN 16K PLOTS</button>
            <button onclick="generate1K()" style="background: #e65100;">⚡ GEN 1K STRING</button>
            <button onclick="importBasic()" style="background: #6a1b9a;">🔄 IMPORT CODE</button>
            <button onclick="copyCode()">📋 COPY CLIPBOARD</button>
            <button onclick="clearAll()" class="full-width">🗑️ RESET STAGE</button>
        </div>

        <div style="margin-top: 15px; font-size: 10px; color: #888;">
            <b>16K PLOTS:</b> Traditional PLOT lines. Easiest to edit.<br><br>
            <b>1K STRING:</b> Compressed data. Fits in 1K RAM! Uses a loop to draw.
        </div>
    </div>

    <div class="main-content">
        <div class="header-label">BASIC Code Output</div>
        <textarea id="codeEditor" spellcheck="false"></textarea>
    </div>

    <script>
        const cvs = document.getElementById('canvas');
        const ctx = cvs.getContext('2d');
        const editor = document.getElementById('codeEditor');

        ctx.fillStyle = "white"; ctx.fillRect(0,0,64,48);

        function handleImage(input) {
            if (!input.files[0]) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    ctx.fillStyle = "white"; ctx.fillRect(0,0,64,48);
                    let s = Math.min(64/img.width, 48/img.height);
                    ctx.drawImage(img, (64 - img.width*s)/2, (48 - img.height*s)/2, img.width*s, img.height*s);
                    const id = ctx.getImageData(0,0,64,48);
                    for (let i=0; i<id.data.length; i+=4) {
                        let v = (id.data[i]+id.data[i+1]+id.data[i+2])/3 < 127 ? 0 : 255;
                        id.data[i] = id.data[i+1] = id.data[i+2] = v;
                    }
                    ctx.putImageData(id, 0,0);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }

        // Standard 16K Version (PLOTs)
        function generateBasic() {
            let out = "10 FAST\n20 CLS\n";
            let l = 30;
            const d = ctx.getImageData(0,0,64,48).data;
            for(let y=0; y<48; y++) {
                for(let x=0; x<64; x++) {
                    if(d[(y*64+x)*4] === 0) {
                        out += `${l} PLOT ${x},${47-y}\n`;
                        l += 2;
                    }
                }
            }
            out += `${l} SLOW\n${l+10} PAUSE 0`;
            editor.value = out;
        }

        // 1K Optimized Version (String)
        function generate1K() {
            const d = ctx.getImageData(0,0,64,48).data;
            let dataString = "";
            for(let y=0; y<48; y++) {
                for(let x=0; x<64; x++) {
                    if(d[(y*64+x)*4] === 0) {
                        // Encode X and Y as characters (shifted by 32 to avoid control codes)
                        dataString += String.fromCharCode(x + 32);
                        dataString += String.fromCharCode((47-y) + 32);
                    }
                }
            }
            
            let out = "10 FAST\n";
            out += "20 CLS\n";
            out += `30 LET A$="${dataString}"\n`;
            out += "40 FOR N=1 TO LEN A$ STEP 2\n";
            out += "50 PLOT CODE A$(N)-32, CODE A$(N+1)-32\n";
            out += "60 NEXT N\n";
            out += "70 SLOW\n";
            out += "80 PAUSE 0";
            editor.value = out;
        }

        function importBasic() {
            const lines = editor.value.split('\n');
            ctx.fillStyle = "white"; ctx.fillRect(0,0,64,48);
            ctx.fillStyle = "black";
            
            // Check for 1K String Format
            const stringLine = lines.find(l => l.includes('LET A$='));
            if(stringLine) {
                const str = stringLine.match(/"([^"]+)"/)[1];
                for(let i=0; i<str.length; i+=2) {
                    let x = str.charCodeAt(i) - 32;
                    let y = 47 - (str.charCodeAt(i+1) - 32);
                    ctx.fillRect(x, y, 1, 1);
                }
                alert("Imported 1K String Art!");
                return;
            }

            // Otherwise, check for standard PLOTs
            lines.forEach(line => {
                const match = line.match(/PLOT\s+(\d+)\s*,\s*(\d+)/i);
                if(match) ctx.fillRect(parseInt(match[1]), 47-parseInt(match[2]), 1, 1);
            });
        }

        function copyCode() { editor.select(); document.execCommand('copy'); }
        function clearAll() { ctx.fillStyle = "white"; ctx.fillRect(0,0,64,48); editor.value = ""; }
    </script>
</body>
</html>
